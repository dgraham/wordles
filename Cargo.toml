[package]
name = "wordles"
version = "1.0.0"
authors = ["David Graham <david.malcom.graham@gmail.com>"]
description = "A Wordle solver."
repository = "https://github.com/dgraham/wordles"
license = "MIT"
edition = "2024"

[dependencies]
getopts = "0.2.24"
fixedbitset = "0.5.9"
lmdb = "0.8.0"
wide = "1.7.1"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
